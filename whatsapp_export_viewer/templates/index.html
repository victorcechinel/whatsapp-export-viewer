<!doctype html>
<html lang="{{viewer_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Export Viewer</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="brand">
        <h1>WhatsApp Export Viewer</h1>
        <p>{{viewer_tagline}}</p>
      </header>
      <section class="controls">
        <input id="search" type="search" placeholder="{{viewer_search_placeholder}}">
        <select id="participant"><option value="">{{viewer_all_participants}}</option></select>
      </section>
      <section class="stats">
        <button class="stat active" type="button" data-view="chat"><b id="total">0</b><span>{{viewer_messages}}</span></button>
        <button class="stat" type="button" data-kind="images"><b id="images">0</b><span>{{viewer_images}}</span></button>
        <button class="stat" type="button" data-kind="videos"><b id="videos">0</b><span>{{viewer_videos}}</span></button>
        <button class="stat" type="button" data-kind="audios"><b id="audios">0</b><span>{{viewer_audios}}</span></button>
        <button class="stat" type="button" data-kind="documents"><b id="docs">0</b><span>{{viewer_documents}}</span></button>
      </section>
      <section class="participants"><h2>{{viewer_participants}}</h2><div id="participants"></div></section>
      <section class="dates"><h2>{{viewer_dates}}</h2><div id="dates"></div></section>
    </aside>
    <main class="main">
      <div class="topbar">
        <div><strong id="viewTitle">{{viewer_chat}}</strong><br><span id="shown">{{viewer_loading}}</span></div>
        <div>
          <button id="backToChat" class="back" type="button">{{viewer_back}}</button>
          <button id="more" class="download" type="button">{{viewer_load_more}}</button>
        </div>
      </div>
      <section id="messages" class="messages"></section>
    </main>
  </div>
  <div id="lightbox" class="lightbox"><button id="closeLightbox" type="button" aria-label="{{viewer_close_lightbox}}">×</button><img id="lightboxImg" alt=""></div>
  <script src="data/bootstrap.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
