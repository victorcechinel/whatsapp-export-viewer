name: Feature request
description: Suggest an improvement for the CLI, GUI, generated viewer, or website.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parser
        - Generated HTML viewer
        - Media gallery
        - Audio conversion
        - GUI
        - Installer/release
        - Documentation/site
        - Other

